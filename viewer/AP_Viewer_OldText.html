<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>360 Spin Viewer (Responsive Slider + Stage + Pingpong + Big Button)</title>
  <style>
    :root { --track: rgba(0,0,0,0.45); --progress: rgba(0,0,0,0.85); }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:transparent}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Helvetica,Arial}
    .wrap{background:transparent;display:grid;gap:2px}
    .stage{position:relative;width:100%;aspect-ratio:16/9;background:transparent;user-select:none;-webkit-user-select:none;touch-action:pan-y;overflow:hidden}
    canvas{width:100%;height:100%;display:block;background:transparent}
    .notice{position:absolute;inset:0;display:grid;place-items:center;background:transparent}
    .spinner{width:40px;height:40px;border:3px solid rgba(0,0,0,0.2);border-top-color:rgba(0,0,0,0.7);border-radius:50%;animation:spin 0.9s linear infinite}
    @keyframes spin { to { transform: rotate(360deg); } }
    .slider{background:transparent;width:min(720px,92vw);margin:-6px auto 0;position:relative;touch-action:none}
    svg{display:block;width:100%;height:auto;overflow:visible}
    .track{fill:none;stroke:var(--track);stroke-width:1;stroke-linecap:round;stroke-dasharray:4 4}
    .progress{fill:none;stroke:var(--progress);stroke-width:3;stroke-linecap:round}
    .cursor-img{cursor:pointer;pointer-events:all}
      .top-bar{display:flex;justify-content:center;padding:8px 12px;pointer-events:none;}
    #toggleViewBtn{
    pointer-events:auto;
    border:1px solid rgba(0,0,0,0.25);
    background:#FFFFFF;
    padding:6px 28px;
    border-radius:999px;
    cursor:pointer;
    font-family:'Be Vietnam Pro', sans-serif;
    font-size:14px;
    font-weight:500;
}
#toggleViewBtn:hover{
    background:rgba(0,0,0,0.05);
}

    .info-text{
      text-align:center;
      font-family:'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      font-size:16px;
      color:#000;
      padding:8px 16px 4px;
      line-height:1.4;
      width:min(720px,92vw);
      margin:0 auto;
    }

    .info-text h2{
      margin:0 0 4px;
      font-size:18px;
      font-weight:600;
    }

    .info-text p{
      margin:0;
      font-size:14px;
      font-weight:400;
    }


    /* Aircraft info card (designer-style) */
    .aircard{
      position:relative;
      width:min(720px,92vw);
      margin:0 auto;
      padding:14px 18px 8px;
      text-align:center;
      font-family:'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      color:#000;
    }
    .aircard-title{
      position:relative;
      z-index:1;
      margin:6px 0 10px;
      font-size:44px;
      line-height:1.05;
      font-weight:800;
      letter-spacing:-0.02em;
    }
    .aircard-body{
      position:relative;
      z-index:1;
      margin:0 auto 14px;
      max-width:620px;
      font-size:14px;
      line-height:1.5;
      font-weight:400;
      opacity:0.95;
    }

    .aircard-stats{
      position:relative;
      z-index:1;
      display:flex;
      justify-content:center;
      gap:26px;
      flex-wrap:wrap;
      margin:14px 0 0;
      font-size:13px;
    }
    .stat{
      display:flex;
      align-items:center;
      gap:10px;
      white-space:nowrap;
    }
    .stat-ico{
      width:18px;
      height:18px;
      object-fit:contain;
      display:block;
      flex:0 0 18px;
    }
    .stat-ico-spacer{
      width:18px;
      height:18px;
      display:block;
      flex:0 0 18px;
    }

    </style>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">

  <div class="top-bar">
    <button id="toggleViewBtn" type="button">View interior</button>
  </div>
  <div class="wrap">
    <div class="stage" id="stage" aria-label="360 spin viewer">
      <canvas id="cnv"></canvas>
      <div class="notice" id="notice" aria-live="polite">
        <div class="spinner" aria-label="Loading"></div>
      </div>
    </div>

    <div id="infoText" class="info-text"></div>

    <div class="slider" id="slider">
      <svg id="svg" viewBox="0 0 720 240" aria-hidden="true">
        <path id="pathTrack" class="track" d="M 20 40 Q 360 220 700 40" />
        <path id="pathProgress" class="progress" d="M 20 40 Q 360 220 700 40"
              pathLength="100" stroke-dasharray="0 100" />
        <image id="cursorImg" class="cursor-img" href="" x="0" y="0" width="84" height="84"/>
    </div>
  </div>

  // EXT/INT toggle
  (function(){

    const m = slug.match(/^(EXT|INT)_([\s\S]+)/i);
    if(!toggleBtn) return;
    if(m){
      const currentPrefix = m[1].toUpperCase();
      const rest = m[2];
      toggleBtn.textContent = currentPrefix==='EXT'?'View interior':'View exterior';
      toggleBtn.onclick = () => {
        const newPrefix = currentPrefix==='EXT'?'INT':'EXT';
        const url = new URL(location.href);
        url.searchParams.set('slug', newPrefix+'_'+rest);
        location.href = url.toString();
      };
    } else {
      toggleBtn.style.display='none';
    }

  const mode = params.get('mode') || 'preloadAll';
  const fps = parseInt(params.get('speed') || '30', 10);

  const baseUrl = DEFAULT_BASE.replace(/\/$/,'') + '/' + slug + '/';

  const cnv = document.getElementById('cnv');
  const ctx = cnv.getContext('2d', { alpha: true, desynchronized: true });
  const notice = document.getElementById('notice');
  const stage = document.getElementById('stage');
  const svg = document.getElementById('svg');
  const pathTrack = document.getElementById('pathTrack');
  const pathProgress = document.getElementById('pathProgress');
  const cursorImg = document.getElementById('cursorImg');

  let images = new Array(frameCount).fill(null);
  let frame = 0;
  let targetFrame = 0;

  let cssW = 0, cssH = 0;

  // Drag states
  let stageDragging = false;
  let stageDragStartX = 0;
  let stageDragStartFrame = 0;
  let stageWidth = 1;

  let sliderDragging = false;
  let sliderDragStartX = 0;
  let sliderDragStartFrame = 0;
  let sliderWidth = 1;

  function pad4(n){ return String(n).padStart(4,'0'); }
  function urlFor(i){ return baseUrl + 'frame_' + pad4(i) + '.' + ext; }

  async function loadBitmap(url){
    try{
      const res = await fetch(url, { cache: 'force-cache' });
      if(!res.ok) return null;
      const blob = await res.blob();
      return await createImageBitmap(blob);
    } catch { return null; }
  }

  function drawFrame(index){
    const bmp = images[index];
    if(!bmp) return;
    ctx.clearRect(0,0,cssW,cssH);
    ctx.drawImage(bmp,0,0,cssW,cssH);
  }

  function frameToRatio(f){ return f/(frameCount-1); }
  function updateProgress(){
    const r = frameToRatio(frame);
    pathProgress.setAttribute('stroke-dasharray', (r*100)+' 100');
    updateCursor(r);
  }

  function updateCursor(ratio){
    const p = pathTrack;
    const len = p.getTotalLength();
    const pt = p.getPointAtLength(Math.max(0,Math.min(len,ratio*len)));
    cursorImg.setAttribute('x', (pt.x - 42));
    cursorImg.setAttribute('y', (pt.y - 42));
  }

  function renderLoop(){
    if(frame !== targetFrame){
      frame = targetFrame;
      drawFrame(frame);
      updateProgress();
    }
    requestAnimationFrame(renderLoop);
  }

  async function preload(){
    if(mode === 'preloadAll'){
      const urls = Array.from({length:frameCount},(_,i)=>urlFor(i));
      const bitmaps = await Promise.all(urls.map(loadBitmap));
      bitmaps.forEach((bmp,i)=>images[i]=bmp);
      drawFrame(0);
      updateProgress();
      notice.style.display='none';
      autoplay();
    } else {
      const eager = Math.min(10,frameCount);
      const eagerUrls = Array.from({length:eager},(_,i)=>urlFor(i));
      const eagerBitmaps = await Promise.all(eagerUrls.map(loadBitmap));
      eagerBitmaps.forEach((bmp,i)=>images[i]=bmp);
      drawFrame(0);
      updateProgress();
      notice.style.display='none';
      autoplay();
      const rest = Array.from({length:frameCount-eager},(_,j)=>urlFor(j+eager));
      Promise.all(rest.map((u,j)=>loadBitmap(u).then(b=>images[eager+j]=b)));
    }
  }

  function resizeCanvas(){
    const rect = stage.getBoundingClientRect();
    cssW = rect.width;
    cssH = rect.height;
    const dpr = Math.min(window.devicePixelRatio||1,2);
    cnv.width = cssW*dpr;
    cnv.height = cssH*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawFrame(frame);
  }
  new ResizeObserver(resizeCanvas).observe(stage);

  // --- STAGE DRAG (full width == full rotation) ---

    stopAutoplay();
    stageWidth = stage.getBoundingClientRect().width || 1;
    stageDragging = true;
    stageDragStartX = e.clientX;
    stageDragStartFrame = targetFrame;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove',e=>{
    if(!stageDragging) return;
    const dx = e.clientX - stageDragStartX;
    const fraction = dx / stageWidth;
    const delta = Math.round(fraction*(frameCount-1));
    let f = stageDragStartFrame - delta;
    f = ( (f%frameCount)+frameCount )%frameCount;
    targetFrame = f;
  });
  stage.addEventListener('pointerup',()=>stageDragging=false);
  stage.addEventListener('pointercancel',()=>stageDragging=false);
  stage.addEventListener('pointerleave',()=>stageDragging=false);

  // --- SLIDER DRAG (relative, works even in portrait) ---
  cursorImg.setAttribute('href', cursorURL);

  cursorImg.addEventListener('pointerdown', e=>{
    stopAutoplay();
    sliderWidth = svg.getBoundingClientRect().width || 1;
    sliderDragging = true;
    sliderDragStartX = e.clientX;
    sliderDragStartFrame = targetFrame;
    cursorImg.setPointerCapture(e.pointerId);
  });

  cursorImg.addEventListener('pointermove', e=>{
    if(!sliderDragging) return;
    const dx = e.clientX - sliderDragStartX;
    const fraction = dx / sliderWidth;
    const delta = Math.round(fraction*(frameCount-1));
    let f = sliderDragStartFrame + delta;
    if (f < 0) f = 0;
    if (f > frameCount-1) f = frameCount-1;
    targetFrame = f;
  });

cursorImg.addEventListener('pointerup', ()=>sliderDragging=false);
  cursorImg.addEventListener('pointercancel', ()=>sliderDragging=false);
  cursorImg.addEventListener('pointerleave', ()=>sliderDragging=false);

  // Tap anywhere on curve to jump
  svg.addEventListener('pointerdown', e=>{
    if(e.target===cursorImg) return;
    const rect = svg.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const p = pathTrack;
    const len = p.getTotalLength();
    let best=0, bestDist=Infinity;
    for(let i=0;i<=160;i++){
      const t=i/160;
      const pt=p.getPointAtLength(t*len);
      const dx=pt.x-x, dy=pt.y-y, d=dx*dx+dy*dy;
      if(d<bestDist){ bestDist=d; best=t; }
    }
    targetFrame = Math.round(best*(frameCount-1));
  });

  async function autoplay(){
    // Cancellable autoplay (stops cleanly on any user interaction)
    autoplayCancel = false;
    autoplayActive = true;

    const delay = 1000 / fps;

    // forward
    for(let f=0; f<frameCount; f++){
      if (autoplayCancel) { autoplayActive = false; return; }
      targetFrame = f;
      await new Promise(r => setTimeout(r, delay));
    }
    // backward (skip last duplicate frame)
    for(let f=frameCount-2; f>=0; f--){
      if (autoplayCancel) { autoplayActive = false; return; }
      targetFrame = f;
      await new Promise(r => setTimeout(r, delay));
    }

    autoplayActive = false;
  }

  resizeCanvas();
  requestAnimationFrame(renderLoop);
  preload();

})();
</script>
</body>
</html>
