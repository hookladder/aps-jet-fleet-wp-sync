<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Partners – Fleet Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&display=swap" rel="stylesheet">
<style>
/* Page shell: replicates Elementor containers 3e57fdb > 7494b51 on /fleet/ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
/* Background (clouds) comes from the Elementor container, not from here */
body {
    background: transparent;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.fleet-render {
    position: relative;
    width: 75%;
    margin: 3rem auto 0;
    padding: 0 10rem 5%;
}
@media (max-width: 1024px) { .fleet-render { width: 70%; padding: 0 2rem 5%; } }
@media (max-width: 767px)  { .fleet-render { width: 100%; padding: 3%; } }

/* Widget 123d8cd / 364e12a – copied from the live page */
#target-fleet-iframe { min-height: 1280px; }
@media screen and (max-width: 1280px) { #target-fleet-iframe { min-height: 980px !important; } }
@media screen and (max-width: 767px)  { #target-fleet-iframe { min-height: 1080px !important; } }

.gallery-title { text-align: center; width: 100%; align-self: center; margin: 8px 0 16px; font-size: 40px; line-height: 48px; font-family: Antonio, sans-serif; font-weight: 700; color: #000; }
.gallery-fleet-container { position: relative; display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; max-width: 1200px; margin: 30px auto; }
.carousel-viewport { width: 100%; overflow: hidden; position: relative; padding: 10px 0; }
.carousel-track { display: flex; gap: 15px; transition: transform .4s ease-in-out; }
.carousel-item { width: 23%; flex: 0 0 calc(25% - 11.25px); height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; box-shadow: rgba(0,0,0,.1) 0 4px 6px; cursor: pointer; transition: transform .3s, filter .3s; }
.carousel-item:hover { transform: scale(1.03); filter: brightness(.6); z-index: 1; position: relative; }
.carousel-control { position: absolute; background-color: transparent; color: #000; border: none; padding: 12px; cursor: pointer; font-size: 24px; border-radius: 4px; transition: background-color .3s; display: flex; align-items: center; justify-content: center; }
.carousel-control:hover { background-color: #333; }
.carousel-control:disabled { color: #ccc; cursor: not-allowed; opacity: .6; }
.prev-btn { left: -50px; }
.next-btn { right: -50px; }
@media screen and (max-width: 767px) {
    .carousel-item { flex: 0 0 calc(50% - 7.5px); }
    .prev-btn { left: -25px; }
    .next-btn { right: -25px; }
}

.simple-lightbox-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,.85); z-index: 9999999; justify-content: center; align-items: center; }
.lightbox-wrapper { position: relative; display: inline-block; max-width: 90vw; max-height: 85vh; }
.lightbox-wrapper img { max-width: 100%; max-height: 85vh; display: block; border-radius: 8px; box-shadow: rgba(0,0,0,.5) 0 10px 25px; }
.simple-lightbox-close { position: absolute; top: -45px; right: 0; color: #fff; font-size: 50px; line-height: 1; font-family: Arial, sans-serif; font-weight: 700; cursor: pointer; z-index: 99999999; transition: color .3s; }
.simple-lightbox-close:hover { color: #ccc; }
.lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background-color: rgba(0,0,0,.6); color: #fff; border: none; font-size: 30px; padding: 10px 15px; cursor: pointer; border-radius: 4px; transition: background-color .3s; z-index: 99999999; }
.lightbox-nav:hover { background-color: rgba(0,0,0,.9); }
.prev-lb { left: -60px; }
.next-lb { right: -60px; }
@media screen and (max-width: 768px) {
    .simple-lightbox-close { top: -40px; }
    .prev-lb { left: 10px; }
    .next-lb { right: 10px; }
}
</style>
</head>
<body>

<main class="fleet-render">
    <div class="iframe-fleet-container">
        <iframe
            id="target-fleet-iframe"
            src="about:blank"
            width="100%"
            height="100%"
            style="border: none; overflow: hidden; display: block;"
            allow="fullscreen; xr-spatial-tracking"
            title="Visualizer 3D">
        </iframe>
    </div>

    <h3 class="gallery-title">Interior Gallery</h3>
    <div class="gallery-fleet-container">
        <button class="carousel-control prev-btn" id="fleet-prev" disabled>&#10094;</button>
        <div class="carousel-viewport">
            <div class="carousel-track" id="fleet-carousel-track"></div>
        </div>
        <button class="carousel-control next-btn" id="fleet-next">&#10095;</button>
    </div>
</main>

<div id="simple-lightbox" class="simple-lightbox-container">
    <div class="lightbox-wrapper">
        <span id="close-simple-lightbox" class="simple-lightbox-close">&times;</span>
        <button id="lightbox-prev" class="lightbox-nav prev-lb">&#10094;</button>
        <img decoding="async" id="simple-lightbox-img" src="" alt="Popup Imagen">
        <button id="lightbox-next" class="lightbox-nav next-lb">&#10095;</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Self-hosted: viewer lives next to this file (viewer/AP_Viewer.html), frames in ../EXT_xxx/
    const iframe = document.getElementById('target-fleet-iframe');
    const fleetButtons = document.querySelectorAll('[id^="f_"]');
    const urlBase = "viewer/AP_Viewer.html?slug=EXT_";
    const urlParams = "&ext=webp&mode=eager";

    // Initial jet: ?jet=VDN (default VDN, same as the fleet page)
    const initialJet = (new URLSearchParams(location.search).get('jet') || 'VDN').toUpperCase();

    const track = document.getElementById('fleet-carousel-track');
    const viewport = document.querySelector('.carousel-viewport');
    const prevBtn = document.getElementById('fleet-prev');
    const nextBtn = document.getElementById('fleet-next');

    let currentSlideIndex = 0;
    const totalItems = 5;

    const WP = "https://airpartners.takeflightgroup.com/wp-content/uploads/2026/03/";
    const galleryData = {
        "VDN": ["C-FVDN-Interior-02-Small.webp", "C-FVDN-Interior-03-Small.webp", "C-FVDN-Interior-04-Small.webp", "C-FVDN-Interior-05-Small.webp", "C-FVDN-Interior-08-Small.webp"],
        "KAI": ["C-FKAI-Interior-02-Small.webp", "C-FKAI-Interior-03-Small.webp", "C-FKAI-Interior-04-Small.webp", "C-FKAI-Interior-05-Small.webp", "C-FKAI-Interior-08-Small.webp"],
        "HHM": ["C-FHHM-510A8015_Final.webp", "C-FHHM-510A8018_Final.webp", "C-FHHM-510A8053_Final.webp", "C-FHHM-510A8136_Final.webp", "C-FHHM-510A8151_Final.webp"],
        "TJO": ["C-GTJO-Interior-5.webp", "C-GTJO-Interior-4.webp", "C-GTJO-Interior-3.webp", "C-GTJO-Interior-2.webp", "C-GTJO-Interior-1.webp"],
        "TLH": ["C-FTLH-Interior-02-Small.webp", "C-FTLH-Interior-04-Small-1.webp", "C-FTLH-Interior-05-Small.webp", "C-FTLH-Interior-08-Small.webp", "C-FTLH-Interior-10-Small.webp"],
        "OAD": ["C-FOAD-Interior-02-Small.webp", "C-FOAD-Interior-04-Small.webp", "C-FOAD-Interior-05-Small.webp", "C-FOAD-Interior-07-Small.webp", "C-FOAD-Interior-08-Small.webp"],
        "JDZ": ["C-FJDZ-Interior-02-Small.webp", "C-FJDZ-Interior-03-Small-1.webp", "C-FJDZ-Interior-05-Small.webp", "C-FJDZ-Interior-07-Small.webp", "C-FJDZ-Interior-08-Small.webp"],
        "AXX": ["C-GAXX-New-Interior-02-Small.webp", "C-GAXX-New-Interior-03-Small.webp", "C-GAXX-New-Interior-05-Small.webp", "C-GAXX-New-Interior-07-Small.webp", "C-GAXX-New-Interior-08-Small.webp"],
        "TJS": ["C-FTLH-Interior-07-Small.webp", "C-FTLH-Interior-05-Small-1.webp", "C-FTLH-Interior-04-Small-1-1.webp", "C-FTLH-Interior-02-Small-1-1.webp", "C-FTLH-Interior-00-Small.webp"],
        "WRX": ["C-FWRX-Interior-02-Small.webp", "C-FWRX-Interior-04-Small.webp", "C-FWRX-Interior-05-Small.webp", "C-FWRX-Interior-07-Small.webp", "C-FWRX-Interior-08-Small.webp"],
        "IAP": ["C-FIAP-Interior-02-Small-1.webp", "C-FIAP-Interior-03-Small.webp", "C-FIAP-Interior-04-Small.webp", "C-FIAP-Interior-05-Small.webp", "C-FIAP-Interior-07-Small.webp"],
        "KHJ": ["C-FKHJ-Interior-02-Small.webp", "C-FKHJ-Interior-03-Small.webp", "C-FKHJ-Interior-04-Small.webp", "C-FKHJ-Interior-05-Small.webp", "C-FKHJ-Interior-07-Small.webp"],
        "XLI": ["C-GXLI-Interior-01-Small.webp", "C-GXLI-Interior-03-Small-1.webp", "C-GXLI-Interior-05-Small.webp", "C-GXLI-Interior-06-Small.webp", "C-GXLI-Interior-07-Small.webp"],
        "YMD": ["Edited-Interior-02-Small-2.webp", "Edited-Interior-03-Small-2.webp", "Edited-Interior-11-Small-2.webp", "Edited-Interior-16-Small-1.webp", "Edited-Interior-19-Small-2.webp"],
        "XPG": ["C-GXPG-Interior-06-Small.webp", "C-GXPG-Interior-05-Small.webp", "C-GXPG-Interior-04-Small.webp", "C-GXPG-Interior-03-Small.webp", "C-GXPG-Interior-02-Small.webp"],
        "AFK": ["C-FAFK-Interior-08-Small-1.webp", "C-GAFK-Interior-07-Small.webp", "C-GAFK-Interior-05-Small.webp", "C-GAFK-Interior-03-Small.webp", "C-GAFK-Interior-02-Small.webp"]
    };

    // --- Lightbox ---
    const lightbox = document.getElementById('simple-lightbox');
    const lightboxImg = document.getElementById('simple-lightbox-img');
    const closeLightboxBtn = document.getElementById('close-simple-lightbox');
    const lbPrevBtn = document.getElementById('lightbox-prev');
    const lbNextBtn = document.getElementById('lightbox-next');

    let currentGalleryImages = [];
    let currentLightboxIndex = 0;
    function updateLightboxImage() {
        lightboxImg.src = currentGalleryImages[currentLightboxIndex];
    }

    function openLightbox(index) {
        currentLightboxIndex = index;
        updateLightboxImage();
        lightbox.style.display = 'flex';
    }

    function closeLightbox() {
        lightbox.style.display = 'none';
        lightboxImg.src = '';
    }

    function lbNextImage() {
        currentLightboxIndex = (currentLightboxIndex < currentGalleryImages.length - 1) ? currentLightboxIndex + 1 : 0;
        updateLightboxImage();
    }

    function lbPrevImage() {
        currentLightboxIndex = (currentLightboxIndex > 0) ? currentLightboxIndex - 1 : currentGalleryImages.length - 1;
        updateLightboxImage();
    }

    closeLightboxBtn.addEventListener('click', closeLightbox);
    lbNextBtn.addEventListener('click', lbNextImage);
    lbPrevBtn.addEventListener('click', lbPrevImage);

    lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox) closeLightbox();
    });

    window.addEventListener('keydown', function(e) {
        if (lightbox.style.display === 'flex') {
            if (e.key === 'ArrowRight') lbNextImage();
            else if (e.key === 'ArrowLeft') lbPrevImage();
            else if (e.key === 'Escape') closeLightbox();
        }
    });

    // --- Carousel ---
    function getMaxIndex() {
        const item = track.querySelector('.carousel-item');
        if (!item || !viewport) return 1;

        const itemTotalWidth = item.offsetWidth + 15;
        const viewportWidth = viewport.offsetWidth + 15;
        const visibleItems = Math.floor(viewportWidth / itemTotalWidth) || 1;

        const max = totalItems - visibleItems;
        return max < 0 ? 0 : max;
    }

    function renderCarousel(slug) {
        const images = (galleryData[slug] || galleryData["VDN"]).map(f => WP + f);
        currentGalleryImages = images;

        track.innerHTML = '';
        currentSlideIndex = 0;

        images.forEach((url, index) => {
            const img = document.createElement('img');
            img.src = url;
            img.classList.add('carousel-item');
            img.alt = `Galería ${slug}`;
            img.addEventListener('click', () => openLightbox(index));
            track.appendChild(img);
        });

        setTimeout(updateCarouselPosition, 50);
    }

    function updateCarouselPosition() {
        const item = track.querySelector('.carousel-item');
        if (!item) return;

        const maxIndex = getMaxIndex();
        const amountToMove = item.offsetWidth + 15;

        if (currentSlideIndex > maxIndex) currentSlideIndex = maxIndex;

        track.style.transform = `translateX(-${currentSlideIndex * amountToMove}px)`;
        prevBtn.disabled = currentSlideIndex === 0;
        nextBtn.disabled = currentSlideIndex >= maxIndex;
    }

    prevBtn.addEventListener('click', () => {
        if (currentSlideIndex > 0) {
            currentSlideIndex--;
            updateCarouselPosition();
        }
    });

    nextBtn.addEventListener('click', () => {
        if (currentSlideIndex < getMaxIndex()) {
            currentSlideIndex++;
            updateCarouselPosition();
        }
    });

    window.addEventListener('resize', updateCarouselPosition);

    // --- Iframe ---
    function loadJet(slug) {
        iframe.src = urlBase + slug + urlParams;
        iframe.title = "Visualizer 3D - " + slug;
        renderCarousel(slug);
    }

    loadJet(initialJet);

    // Same hook as the fleet page: any element with id="f_xxx" switches the jet
    fleetButtons.forEach(button => {
        button.addEventListener('click', function(e) {
            e.preventDefault();
            fleetButtons.forEach(btn => btn.classList.remove('fleet-btn-active'));
            this.classList.add('fleet-btn-active');

            const slugRaw = this.id.split('_')[1];
            if (!slugRaw || slugRaw.length !== 3) return;
            loadJet(slugRaw.toUpperCase());
        });
    });
});
</script>
</body>
</html>
